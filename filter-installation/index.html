<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>TCL One-Way Cassette | Filter Installation</title>

  <style>

    :root {
      --navy: #17345f;
      --blue-gray: #637b98;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        Helvetica,
        sans-serif;

      color: var(--navy);

      background: linear-gradient(
        180deg,
        #ffffff 0%,
        #f5faff 100%
      );

      -webkit-font-smoothing: antialiased;
    }


    .page {
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;

      display: flex;
      flex-direction: column;

      padding:
        max(18px, env(safe-area-inset-top))
        12px
        max(18px, env(safe-area-inset-bottom));
    }


    /* 彩色 Logo：不加背景、不加文字、不加色块 */

    .brand {
      width: 100%;

      display: flex;
      justify-content: center;
      align-items: center;

      flex-shrink: 0;
    }

    .brand img {
      width: 145px;
      height: auto;

      display: block;

      object-fit: contain;
    }


    /* 主体 */

    .hero {
      flex: 1;

      width: 100%;

      display: flex;
      flex-direction: column;

      justify-content: center;
      align-items: center;

      text-align: center;

      padding-bottom: 3vh;
    }


    h1 {
      margin: 0;

      color: var(--navy);

      font-size: clamp(22px, 3vw, 31px);

      line-height: 1.1;

      font-weight: 700;

      letter-spacing: -0.025em;

      white-space: nowrap;
    }


    .video-title {
      margin-top: 7px;

      color: var(--blue-gray);

      font-size: clamp(17px, 2vw, 21px);

      line-height: 1.2;

      font-weight: 400;
    }


    /* 视频固定横屏 */

    .video-container {
      width: min(78vw, 850px);

      margin-top: 20px;
    }

    video {
      width: 100%;

      aspect-ratio: 16 / 9;

      display: block;

      object-fit: contain;

      background: #000;

      border-radius: 12px;

      box-shadow:
        0 15px 38px
        rgba(23, 52, 95, 0.15);
    }


    /* 手机端 */

    @media (max-width: 600px) {

      .page {
        padding-left: 10px;
        padding-right: 10px;
      }

      .brand img {
        width: 125px;
      }

      .hero {
        transform: translateY(-1.5vh);

        padding-bottom: 0;
      }

      h1 {
        font-size: clamp(
          17px,
          5vw,
          20px
        );

        white-space: nowrap;
      }

      .video-title {
        margin-top: 6px;

        font-size: 16px;
      }

      .video-container {
        width: 90vw;

        max-width: 430px;

        margin-top: 17px;
      }

      video {
        aspect-ratio: 16 / 9;

        object-fit: contain;

        border-radius: 10px;
      }

    }


    @media (max-width: 350px) {

      .brand img {
        width: 112px;
      }

      h1 {
        font-size: 16px;
      }

      .video-container {
        width: 92vw;
      }

    }

  </style>

</head>


<body>

  <main class="page">


    <!-- 直接显示彩色透明 Logo -->

    <header class="brand">

      <img
        src="../brand-logo.png"
        alt="TCL Worldwide Olympic Partner"
      >

    </header>


    <section class="hero">


      <h1>
        TCL One-Way Cassette
      </h1>


      <div class="video-title">
        Filter Installation
      </div>


      <div class="video-container">

        <video
          controls
          playsinline
          webkit-playsinline
          preload="metadata"
        >

          <source
            src="filter-installation.mp4"
            type="video/mp4"
          >

          Your browser does not support video playback.

        </video>

      </div>


    </section>

  </main>

</body>

</html>
